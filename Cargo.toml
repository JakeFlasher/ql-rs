[workspace]
resolver = "3"
members = [
    "crates/ql-time",
    "crates/ql-ad",
    "crates/ql-math",
    "crates/ql-curves",
    "crates/ql-vol",
    "crates/ql-instruments",
    "crates/ql-models",
    "crates/ql-pde",
    "crates/ql-mc",
    "crates/ql-scripting",
    "crates/ql-xva",
    "crates/ql-portfolio",
    "crates/ql-credit",
    "crates/ql-inflation",
    "crates/ql-fx",
    "crates/ql-rates",
    "crates/ql-dml",
    "crates/ql-exotics",
    "crates/ql-commodities",
    "crates/ql-levy",
    "crates/ql-fixed-income",
    "crates/ql-benches",
    "crates/ql-terminal",
]
exclude = ["repos/volsurf", "repos/volsurf/python", "repos/volsurf/wasm", "repos/implied-vol"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
smallvec = { version = "1", features = ["serde"] }
nalgebra = "0.34"
libm = "0.2.16"
implied-vol = { path = "repos/implied-vol", features = ["fma"] }
volsurf = { path = "repos/volsurf", features = ["parallel"] }
ql-time = { path = "crates/ql-time" }
ql-ad = { path = "crates/ql-ad" }
ql-math = { path = "crates/ql-math" }
ql-curves = { path = "crates/ql-curves" }
ql-vol = { path = "crates/ql-vol" }
ql-instruments = { path = "crates/ql-instruments" }
ql-models = { path = "crates/ql-models" }
ql-mc = { path = "crates/ql-mc" }
ql-scripting = { path = "crates/ql-scripting" }
ql-pde = { path = "crates/ql-pde" }
ql-xva = { path = "crates/ql-xva" }
ql-portfolio = { path = "crates/ql-portfolio" }
ql-credit = { path = "crates/ql-credit" }
ql-inflation = { path = "crates/ql-inflation" }
ql-fx = { path = "crates/ql-fx" }
ql-benches = { path = "crates/ql-benches" }
ql-rates = { path = "crates/ql-rates" }
ql-dml = { path = "crates/ql-dml" }
ql-exotics = { path = "crates/ql-exotics" }
ql-commodities = { path = "crates/ql-commodities" }
ql-levy = { path = "crates/ql-levy" }
ql-fixed-income = { path = "crates/ql-fixed-income" }
rayon = "1.11"

[patch.crates-io]
implied-vol = { path = "repos/implied-vol" }
